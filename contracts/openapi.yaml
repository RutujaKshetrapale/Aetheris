openapi: 3.2.0
info:
  title: AETHERIS Pathfinding & Algorithmic Exploration API
  description: Canonical contract for the AETHERIS cross-platform deterministic pathfinding engine. Revision 2.1.0.
  version: 2.1.0
  contact:
    name: AETHERIS Engineering Team
servers:
  - url: http://localhost:8080
    description: Spring Boot 4.2.0 (Java 25) Backend
  - url: http://localhost:5000
    description: .NET 11 (C# 13) Backend

paths:
  /api/v1/health:
    get:
      summary: Overall System Health Status
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Overall system health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/health/live:
    get:
      summary: Liveness Probe
      operationId: getLiveness
      tags:
        - Health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'

  /api/v1/health/ready:
    get:
      summary: Readiness Probe
      operationId: getReadiness
      tags:
        - Health
      responses:
        '200':
          description: Core pathfinding engine is ready to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
        '503':
          description: Core pathfinding engine is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/pathfinding/algorithms:
    get:
      summary: List Supported Algorithms
      operationId: getAlgorithms
      tags:
        - Pathfinding
      responses:
        '200':
          description: List of available algorithms and their metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlgorithmInfo'

  /api/v1/pathfinding/trace:
    post:
      summary: Execute Deterministic Pathfinding and Generate Reversible Trace
      operationId: tracePath
      tags:
        - Pathfinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathfindingRequest'
      responses:
        '200':
          description: Deterministic pathfinding execution result with reversible trace deltas and keyframes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathfindingResponse'
        '400':
          description: Malformed JSON, invalid algorithm, or invalid request schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Validly parsed request violating domain coordinates, weights, or wall placement rules
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/presets:
    get:
      summary: List Grid Presets
      operationId: listPresets
      tags:
        - Presets
      responses:
        '200':
          description: Available grid presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridPreset'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Save Grid Preset
      operationId: savePreset
      tags:
        - Presets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePresetRequest'
      responses:
        '201':
          description: Preset saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridPreset'
        '400':
          description: Malformed preset request or invalid identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Preset with the specified ID already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Preset grid violates domain coordinates, weights, or wall placement rules
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/presets/{id}:
    get:
      summary: Get Preset by ID
      operationId: getPresetById
      tags:
        - Presets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grid preset found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridPreset'
        '400':
          description: Invalid preset identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Preset not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      summary: Update Existing Grid Preset
      operationId: updatePreset
      tags:
        - Presets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePresetRequest'
      responses:
        '200':
          description: Preset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridPreset'
        '400':
          description: Malformed preset update request or mismatched ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Preset not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Preset grid violates domain coordinates, weights, or wall placement rules
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete Grid Preset
      operationId: deletePreset
      tags:
        - Presets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Preset deleted successfully
        '400':
          description: Invalid preset identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Preset not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/presets/export:
    post:
      summary: Export Presets in Canonical Portable Bundle Format
      operationId: exportPresets
      tags:
        - Presets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportPresetsRequest'
      responses:
        '200':
          description: Portable preset bundle serialized canonically (UTF-8, LF, sorted keys, 2-space indent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetBundle'
        '400':
          description: Malformed export request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: One or more requested preset IDs were not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/presets/import:
    post:
      summary: Import Presets from Canonical Portable Bundle
      operationId: importPresets
      tags:
        - Presets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetBundle'
      responses:
        '200':
          description: Presets validated and imported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPresetsResponse'
        '400':
          description: Malformed JSON or bundle schema violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Incompatible bundle format/version, hash mismatch, or invalid grid domain constraints
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/benchmarks:
    post:
      summary: Execute Algorithm Benchmark and Persist Summary Record
      operationId: runBenchmark
      tags:
        - Benchmarks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkRequest'
      responses:
        '201':
          description: Benchmark executed and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRecord'
        '400':
          description: Malformed benchmark request or invalid schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Referenced preset ID not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Benchmark grid violates domain coordinates, weights, or wall placement rules
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/benchmarks/{id}:
    get:
      summary: Retrieve Benchmark Record by ID
      operationId: getBenchmarkById
      tags:
        - Benchmarks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Benchmark record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRecord'
        '400':
          description: Invalid benchmark identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Benchmark record not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Persistence layer unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    AlgorithmType:
      type: string
      enum:
        - BFS
        - DFS
        - DIJKSTRA
        - ASTAR

    CellType:
      type: string
      enum:
        - EMPTY
        - WALL
        - WEIGHTED
        - START
        - TARGET

    TraversalState:
      type: string
      enum:
        - UNVISITED
        - FRONTIER
        - ACTIVE
        - CLOSED

    TraceAction:
      type: string
      enum:
        - INITIALIZE
        - ENQUEUE_FRONTIER
        - DEQUEUE_FRONTIER
        - EXAMINE_NODE
        - UPDATE_METRICS
        - CLOSE_NODE
        - PATH_FOUND
        - NO_PATH_FOUND

    HeuristicType:
      type: string
      enum:
        - MANHATTAN

    CellDefinition:
      type: object
      required:
        - id
        - row
        - col
        - cellType
      properties:
        id:
          type: string
          pattern: '^r\\d+c\\d+$'
          example: 'r0c0'
        row:
          type: integer
          minimum: 0
        col:
          type: integer
          minimum: 0
        cellType:
          $ref: '#/components/schemas/CellType'
        weight:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Entry cost into destination cell. EMPTY is 1, WEIGHTED is 2-100, START is 0.

    CellState:
      type: object
      required:
        - cellType
        - traversalState
        - inPath
      properties:
        cellType:
          $ref: '#/components/schemas/CellType'
        traversalState:
          $ref: '#/components/schemas/TraversalState'
        inPath:
          type: boolean
        gCost:
          type: integer
          nullable: true
        hCost:
          type: integer
          nullable: true
        fCost:
          type: integer
          nullable: true
        parentId:
          type: string
          nullable: true

    GridModel:
      type: object
      required:
        - rows
        - cols
        - startNode
        - targetNode
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 200
        cols:
          type: integer
          minimum: 1
          maximum: 200
        startNode:
          type: string
          pattern: '^r\\d+c\\d+$'
          example: 'r0c0'
        targetNode:
          type: string
          pattern: '^r\\d+c\\d+$'
          example: 'r4c4'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CellDefinition'

    HeapSwap:
      type: object
      required:
        - indexA
        - indexB
        - nodeA
        - nodeB
      properties:
        indexA:
          type: integer
          minimum: 0
        indexB:
          type: integer
          minimum: 0
        nodeA:
          type: string
        nodeB:
          type: string

    TraceDelta:
      type: object
      required:
        - step
        - action
      properties:
        step:
          type: integer
          minimum: 0
        action:
          $ref: '#/components/schemas/TraceAction'
        operationSubtype:
          type: string
          nullable: true
          description: Operation subtype when action is ENQUEUE_FRONTIER (e.g. DECREASE_KEY)
        nodeId:
          type: string
          nullable: true
          pattern: '^r\\d+c\\d+$'
        beforeState:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CellState'
        afterState:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CellState'
        frontierSize:
          type: integer
          minimum: 0
        heapSwaps:
          type: array
          items:
            $ref: '#/components/schemas/HeapSwap'
          description: Exact physical heap swaps to ensure bit-level array reversibility
        details:
          type: string
          nullable: true

    Keyframe:
      type: object
      required:
        - step
        - cellStates
        - frontier
        - closedCount
      properties:
        step:
          type: integer
          minimum: 0
        cellStates:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CellState'
        frontier:
          type: array
          items:
            type: string
        activeNode:
          type: string
          nullable: true
        closedCount:
          type: integer
          minimum: 0

    ExecutionMetrics:
      type: object
      required:
        - pathNodeCount
        - pathEdgeCount
        - algorithmPathCost
        - terrainPathCost
        - nodesVisited
        - maxFrontierSize
        - executionTimeMs
        - totalSteps
      properties:
        pathNodeCount:
          type: integer
          minimum: 0
          description: Total nodes in path (1 if start==target, 0 if no path)
        pathEdgeCount:
          type: integer
          minimum: 0
          description: Total edges in path (0 if start==target or no path)
        algorithmPathCost:
          type: integer
          nullable: true
          description: BFS/DFS edge count; Dijkstra/A* weighted entry cost (null if no path)
        terrainPathCost:
          type: integer
          nullable: true
          description: Cumulative destination terrain entry cost excluding START (null if no path)
        nodesVisited:
          type: integer
          minimum: 0
          description: Unique nodes removed from frontier and examined
        maxFrontierSize:
          type: integer
          minimum: 0
        executionTimeMs:
          type: number
          format: double
          minimum: 0.0
        totalSteps:
          type: integer
          minimum: 0

    PathfindingRequest:
      type: object
      required:
        - algorithm
        - grid
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmType'
        grid:
          $ref: '#/components/schemas/GridModel'
        heuristic:
          $ref: '#/components/schemas/HeuristicType'
          default: MANHATTAN

    PathfindingResponse:
      type: object
      required:
        - algorithm
        - pathFound
        - path
        - pathNodeCount
        - pathEdgeCount
        - algorithmPathCost
        - terrainPathCost
        - traceDeltas
        - keyframes
        - metrics
        - reversible
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmType'
        pathFound:
          type: boolean
        path:
          type: array
          items:
            type: string
            pattern: '^r\\d+c\\d+$'
        pathNodeCount:
          type: integer
          minimum: 0
        pathEdgeCount:
          type: integer
          minimum: 0
        algorithmPathCost:
          type: integer
          nullable: true
        terrainPathCost:
          type: integer
          nullable: true
        traceDeltas:
          type: array
          items:
            $ref: '#/components/schemas/TraceDelta'
        keyframes:
          type: array
          items:
            $ref: '#/components/schemas/Keyframe'
        metrics:
          $ref: '#/components/schemas/ExecutionMetrics'
        reversible:
          type: boolean
          default: true
        noPathReason:
          type: string
          nullable: true
          enum:
            - FRONTIER_EXHAUSTED

    AlgorithmInfo:
      type: object
      required:
        - id
        - name
        - description
        - weighted
        - guaranteedShortestPath
        - frontierType
      properties:
        id:
          $ref: '#/components/schemas/AlgorithmType'
        name:
          type: string
        description:
          type: string
        weighted:
          type: boolean
        guaranteedShortestPath:
          type: boolean
        frontierType:
          type: string
          enum:
            - FIFO_QUEUE
            - LIFO_STACK
            - INDEXED_MIN_HEAP

    GridPreset:
      type: object
      required:
        - id
        - name
        - grid
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        grid:
          $ref: '#/components/schemas/GridModel'
        createdAt:
          type: string
          format: date-time

    SavePresetRequest:
      type: object
      required:
        - name
        - grid
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        grid:
          $ref: '#/components/schemas/GridModel'

    ExportPresetsRequest:
      type: object
      properties:
        presetIds:
          type: array
          items:
            type: string

    PresetBundle:
      type: object
      required:
        - format
        - formatVersion
        - presets
      properties:
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        exportedAt:
          type: string
          format: date-time
        format:
          type: string
          enum:
            - aetheris-preset-bundle
        formatVersion:
          type: string
          enum:
            - '1.0.0'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/GridPreset'

    ImportPresetsResponse:
      type: object
      required:
        - importedCount
        - presets
      properties:
        importedCount:
          type: integer
          minimum: 0
        presets:
          type: array
          items:
            $ref: '#/components/schemas/GridPreset'

    BenchmarkRequest:
      type: object
      required:
        - algorithm
      properties:
        name:
          type: string
        presetId:
          type: string
        algorithm:
          $ref: '#/components/schemas/AlgorithmType'
        heuristic:
          $ref: '#/components/schemas/HeuristicType'
          default: MANHATTAN
        grid:
          $ref: '#/components/schemas/GridModel'

    BenchmarkRecord:
      type: object
      required:
        - id
        - algorithm
        - heuristic
        - gridRows
        - gridCols
        - startNode
        - targetNode
        - pathFound
        - pathNodeCount
        - pathEdgeCount
        - algorithmPathCost
        - terrainPathCost
        - nodesVisited
        - maxFrontierSize
        - totalSteps
        - executionTimeMs
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        presetId:
          type: string
          nullable: true
        algorithm:
          $ref: '#/components/schemas/AlgorithmType'
        heuristic:
          $ref: '#/components/schemas/HeuristicType'
        gridRows:
          type: integer
          minimum: 1
          maximum: 200
        gridCols:
          type: integer
          minimum: 1
          maximum: 200
        startNode:
          type: string
          pattern: '^r[0-9]+c[0-9]+$'
        targetNode:
          type: string
          pattern: '^r[0-9]+c[0-9]+$'
        pathFound:
          type: boolean
        pathNodeCount:
          type: integer
          minimum: 0
        pathEdgeCount:
          type: integer
          minimum: 0
        algorithmPathCost:
          type: integer
          nullable: true
        terrainPathCost:
          type: integer
          nullable: true
        nodesVisited:
          type: integer
          minimum: 0
        maxFrontierSize:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        executionTimeMs:
          type: number
          format: double
          minimum: 0.0
        createdAt:
          type: string
          format: date-time

    HealthStatus:
      type: object
      required:
        - status
        - engineStatus
        - persistenceStatus
        - platform
        - version
        - persistenceEngine
        - databaseConnected
      properties:
        status:
          type: string
          example: 'UP'
        engineStatus:
          type: string
          example: 'UP'
        persistenceStatus:
          type: string
          example: 'UP'
        platform:
          type: string
          example: 'Spring Boot 4.2.0 (Java 25)'
        version:
          type: string
          example: '2.1.0'
        persistenceEngine:
          type: string
          enum:
            - MYSQL
            - MONGODB
            - IN_MEMORY
        databaseConnected:
          type: boolean
          example: false
          description: True only when an external MySQL or MongoDB connection is active; false for IN_MEMORY or unimplemented stubs.

    ProbeStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: 'UP'

    ProblemDetails:
      type: object
      required:
        - status
        - title
      properties:
        type:
          type: string
          format: uri
          example: 'https://aetheris.dev/errors/not-found'
        title:
          type: string
          example: 'Resource Not Found'
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: 'The requested preset was not found.'
        instance:
          type: string
          format: uri-reference
          example: '/api/v1/presets/preset-123'
