# AETHERIS Unified Multi-Profile Docker Compose Specification
# Architecture Revision: 2.1.0
#
# Supports all 8 deployment profiles (plus IN_MEMORY development mode):
#   react-sp-my, react-sp-mg, react-dn-my, react-dn-mg,
#   ang-sp-my,   ang-sp-mg,   ang-dn-my,   ang-dn-mg

services:
  # Frontends
  frontend-react:
    profiles: ["react-sp-my", "react-sp-mg", "react-dn-my", "react-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend-react
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}

  frontend-angular:
    profiles: ["ang-sp-my", "ang-sp-mg", "ang-dn-my", "ang-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend-angular
    ports:
      - "4200:80"

  # Backends
  backend-springboot:
    profiles: ["react-sp-my", "react-sp-mg", "ang-sp-my", "ang-sp-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend-springboot
    ports:
      - "8080:8080"
    environment:
      - AETHERIS_PERSISTENCE_ENGINE=${AETHERIS_PERSISTENCE_ENGINE:-IN_MEMORY}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/aetheris?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-aetheris}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-aetheris_password}
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb://aetheris:aetheris_password@mongodb:27017/aetheris?authSource=admin}
      - SPRING_DATA_MONGODB_DATABASE=${SPRING_DATA_MONGODB_DATABASE:-aetheris}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend-dotnet:
    profiles: ["react-dn-my", "react-dn-mg", "ang-dn-my", "ang-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend-dotnet
    ports:
      - "5000:5000"
    environment:
      - Aetheris__Persistence__Engine=${Aetheris__Persistence__Engine:-IN_MEMORY}
      - ConnectionStrings__MySql=${ConnectionStrings__MySql:-Server=mysql;Port=3306;Database=aetheris;User=aetheris;Password=aetheris_password;}
      - ConnectionStrings__Mongo=${ConnectionStrings__Mongo:-mongodb://aetheris:aetheris_password@mongodb:27017/aetheris?authSource=admin}
      - Aetheris__Persistence__MongoDb__Database=${Aetheris__Persistence__MongoDb__Database:-aetheris}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Databases
  mysql:
    profiles: ["react-sp-my", "react-dn-my", "ang-sp-my", "ang-dn-my"]
    image: mysql:9.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=aetheris
      - MYSQL_USER=aetheris
      - MYSQL_PASSWORD=aetheris_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/mysql/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/mysql/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ../database/mysql/seed/01-seed-presets.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongodb:
    profiles: ["react-sp-mg", "react-dn-mg", "ang-sp-mg", "ang-dn-mg"]
    image: mongo:9.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=aetheris
      - MONGO_INITDB_ROOT_PASSWORD=aetheris_password
      - MONGO_INITDB_DATABASE=aetheris
    volumes:
      - mongo_data:/data/db
      - ../database/mongodb/init/01-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
  mongo_data:
