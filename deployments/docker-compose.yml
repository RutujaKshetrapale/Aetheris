# AETHERIS Unified Multi-Profile Docker Compose Specification
# Architecture Revision: 2.1.0
#
# ARCHITECTURAL COMPLIANCE NOTICE:
# - Frontends (React 19.3.1, Angular 22.3.0) and Backends (Spring Boot 4.2.0 Java 25, .NET 11.0.100 C#)
#   provide 100% feature-complete pathfinding, execution metrics, and reversible trace engines.
# - The default operational persistence mode is IN_MEMORY.
# - Database services (MySQL 9.7 LTS, MongoDB 9.0) are provisioned for all 8 deployment profiles.
# - MySQL and MongoDB application adapters are formal architectural boundary stubs returning
#   RFC 9457 Problem Details (HTTP 503 Service Unavailable) pending Phase 2 data store implementation.

services:
  # Frontends
  frontend-react:
    profiles: ["react-sp-my", "react-sp-mg", "react-dn-my", "react-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend-react
    ports:
      - "3000:80"

  frontend-angular:
    profiles: ["ang-sp-my", "ang-sp-mg", "ang-dn-my", "ang-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend-angular
    ports:
      - "4200:80"

  # Backends
  backend-springboot:
    profiles: ["react-sp-my", "react-sp-mg", "ang-sp-my", "ang-sp-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend-springboot
    ports:
      - "8080:8080"
    environment:
      - AETHERIS_PERSISTENCE_ENGINE=${AETHERIS_PERSISTENCE_ENGINE:-IN_MEMORY}

  backend-dotnet:
    profiles: ["react-dn-my", "react-dn-mg", "ang-dn-my", "ang-dn-mg"]
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend-dotnet
    ports:
      - "5000:5000"
    environment:
      - Aetheris__Persistence__Engine=${Aetheris__Persistence__Engine:-IN_MEMORY}

  # Databases
  mysql:
    profiles: ["react-sp-my", "react-dn-my", "ang-sp-my", "ang-dn-my"]
    image: mysql:9.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=aetheris
      - MYSQL_USER=aetheris
      - MYSQL_PASSWORD=aetheris_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    profiles: ["react-sp-mg", "react-dn-mg", "ang-sp-mg", "ang-dn-mg"]
    image: mongo:9.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=aetheris
      - MONGO_INITDB_ROOT_PASSWORD=aetheris_password
      - MONGO_INITDB_DATABASE=aetheris
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
