services:
  frontend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.backend-dotnet
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - Aetheris__Persistence__Engine=MYSQL
      - ConnectionStrings__MySql=Server=mysql;Port=3306;Database=aetheris;User=aetheris;Password=aetheris_password;
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mysql:
    image: mysql:9.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=aetheris
      - MYSQL_USER=aetheris
      - MYSQL_PASSWORD=aetheris_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database/mysql/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../database/mysql/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ../../database/mysql/seed/01-seed-presets.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
