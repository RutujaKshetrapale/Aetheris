services:
  frontend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.frontend-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:5000

  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.backend-dotnet
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      - Aetheris__Persistence__Engine=MYSQL
      - ConnectionStrings__MySql=Server=mysql;Port=3306;Database=aetheris;User=aetheris;Password=aetheris_password;

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=aetheris
      - MYSQL_USER=aetheris
      - MYSQL_PASSWORD=aetheris_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
