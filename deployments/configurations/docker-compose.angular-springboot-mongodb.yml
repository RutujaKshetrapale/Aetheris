services:
  frontend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.backend-springboot
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - AETHERIS_PERSISTENCE_ENGINE=MONGODB
      - SPRING_DATA_MONGODB_URI=mongodb://aetheris:aetheris_password@mongodb:27017/aetheris?authSource=admin

  mongodb:
    image: mongo:9.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=aetheris
      - MONGO_INITDB_ROOT_PASSWORD=aetheris_password
      - MONGO_INITDB_DATABASE=aetheris
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
